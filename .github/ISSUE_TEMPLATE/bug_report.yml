name: Bug report
description: Report a problem with ruby_ability_graph
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Command(s) run, and a minimal Ability class/roles file if relevant.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ruby_ability_graph version
      placeholder: e.g. 0.1.1
    validations:
      required: true
  - type: input
    id: ruby-version
    attributes:
      label: Ruby version
      placeholder: e.g. 3.3.0
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
