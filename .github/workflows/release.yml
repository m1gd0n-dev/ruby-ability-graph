name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  push:
    name: Push gem to RubyGems.org
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      id-token: write # required for trusted publishing
      contents: write # required for `rake release` to push the release tag

    environment: release # requires manual approval -- configured on the repo, matches the publisher on RubyGems.org

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
